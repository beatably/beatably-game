<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta property="og:site_name" content="Beatably">
    <meta property="og:title" content="Beatably — The Music Timeline Party Game">
    <meta property="og:description" content="Hear a song, guess when it dropped, and build your timeline. Challenge your friends and steal their cards. First to fill their timeline wins.">

    <!-- Immediate inline background to avoid white flash before external CSS loads -->
    <style>html,body{background-color:#0C0A1A!important;margin:0;min-height:100%}</style>

    <!-- Nunito is self-hosted: loading it from Google would send every visitor's
         IP to a third party, which needs consent we do not ask for. -->
    <link rel="preload" href="/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link href="/fonts/nunito.css" rel="stylesheet">

    <!-- Ghost hero poster (first paint) -->
    <link rel="preload" as="image" href="/img/first_frame.jpg">

    <!-- Structured data: helps search engines and LLMs understand what Beatably
         is, that it's a free game, and where to get it (web + App Store). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SoftwareApplication",
          "name": "Beatably",
          "description": "Beatably is the free multiplayer music timeline party game. Hear a song, guess the release year, place it in order on your timeline, and steal the cards your friends get wrong. First to fill their timeline wins. A solo guess-the-year mode is included.",
          "applicationCategory": "GameApplication",
          "operatingSystem": "iOS, Web",
          "url": "https://beatably.app/",
          "installUrl": "https://apps.apple.com/app/beatably/id6788660791",
          "image": "https://beatably.app/img/landing/og-image.png",
          "inLanguage": "en",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          },
          "publisher": { "@id": "https://beatably.app/#org" }
        },
        {
          "@type": "WebSite",
          "name": "Beatably",
          "url": "https://beatably.app/",
          "inLanguage": "en",
          "publisher": { "@id": "https://beatably.app/#org" }
        },
        {
          "@type": "Organization",
          "@id": "https://beatably.app/#org",
          "name": "Beatably",
          "url": "https://beatably.app/",
          "logo": "https://beatably.app/img/icon-192.png"
        }
      ]
    }
    </script>

    <div id="landing-root"></div>
    <noscript>
      <div style="font-family: Nunito, system-ui, sans-serif; color: #fafafa; max-width: 32rem; margin: 4rem auto; padding: 0 1.5rem; text-align: center;">
        <h1>Beatably — the music timeline party game</h1>
        <p>Hear a song, guess the year it was released, and build your timeline. Challenge your friends' picks and steal their cards. First to fill their timeline wins. Play solo or with friends, free in your browser and on iPhone.</p>
        <p><a href="https://play.beatably.app" style="color: #08AF9A;">Play in your browser</a></p>
      </div>
